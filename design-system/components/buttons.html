<!-- @dsCard group="Components" -->
<style>
  .bt{font-family:Inter,system-ui,sans-serif;padding:24px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  .bt .btn{font:600 14px Inter,system-ui,sans-serif;padding:14px 28px;border-radius:100px;cursor:pointer;transition:transform .15s ease,box-shadow .15s ease;border:0}
  .bt .btn:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.12)}
  .bt .primary{background:#E64400;color:#fff}
  .bt .secondary{background:transparent;color:#111;border:1px solid #111}
  .bt .lbl{font-size:11px;color:#444;width:100%}
</style>
<div class="bt">
  <button class="btn primary">Shop everything</button>
  <button class="btn secondary">View all</button>
  <div class="lbl">Primary — accent pill, white text. Secondary — ink outline pill. Both lift 2px on hover. Radius 100 (full pill) everywhere.</div>
</div>
