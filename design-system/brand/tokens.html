<style>
  .tk{font-family:Inter,system-ui,sans-serif;color:#111;padding:24px}
  .tk h2{font-family:'Archivo Black','Arial Black',sans-serif;text-transform:uppercase;font-size:20px;margin:0 0 16px}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .sw{width:120px;border:1px solid #E6E6E6;border-radius:8px;overflow:hidden}
  .sw .c{height:64px}
  .sw .l{padding:8px;font-size:11px;line-height:1.5}
  .sw .l b{display:block;font-size:12px}
</style>
<div class="tk">
  <h2>Color</h2>
  <div class="row">
    <div class="sw"><div class="c" style="background:#ffffff;border-bottom:1px solid #E6E6E6"></div><div class="l"><b>#FFFFFF</b>background — the canvas stays white</div></div>
    <div class="sw"><div class="c" style="background:#111111"></div><div class="l"><b>#111111</b>foreground — ink for text &amp; UI</div></div>
    <div class="sw"><div class="c" style="background:#E64400"></div><div class="l"><b>#E64400</b>accent — CTAs and sale badges ONLY</div></div>
    <div class="sw"><div class="c" style="background:#444444"></div><div class="l"><b>#444444</b>secondary text</div></div>
    <div class="sw"><div class="c" style="background:#E6E6E6"></div><div class="l"><b>#E6E6E6</b>borders / dividers</div></div>
  </div>
  <p style="font-size:12px;color:#444;max-width:52ch">Rule: one loud note on a monochrome page. The orange appears only where we want the eye to land — never for decoration.</p>
</div>
